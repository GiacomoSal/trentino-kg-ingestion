# Namespace definitions for clean URIs
namespaces:
  etype: "http://knowdive.disi.unitn.it/etype#"
  osm: "http://www.semanticweb.org/lixiaoyue/ontologies/2023/2/untitled-ontology-26#"
  app: "http://knowdive.disi.unitn.it/trentino-app#"

# Semantic mappings from raw OSM tags to TBox classes
mappings:
  - target_class: "etype:bar_pub"
    osm_filter:
      amenity: ["bar", "pub"]
      
  - target_class: "etype:restaurant"
    osm_filter:
      amenity: ["restaurant", "fast_food"]

  - target_class: "etype:cafe"
    osm_filter:
      amenity: ["cafe"]

  - target_class: "etype:hotel"
    osm_filter:
      tourism: ["hotel", "motel", "guest_house", "alpine_hut"]

  - target_class: "etype:museum"
    osm_filter:
      tourism: ["museum", "gallery"]
      historic: ["castle", "ruins"]

  - target_class: "etype:train_station"
    osm_filter:
      railway: ["station", "halt"]
      
  - target_class: "etype:bus_stop"
    osm_filter:
      highway: ["bus_stop"]