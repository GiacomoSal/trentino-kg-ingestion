# Pipeline configuration.
# The generic stages (src/2_mapping.py, src/3_unification.py, src/4_teleology.py) only read this file and
# the files it points to: they know nothing about the specific sources. Adding a source means
# adding its extraction script (or an existing RDF file), an alignment file and an entry below.

# The ontology everything is aligned to (space and time; the GTFS part is not used here)
unified_ontology: "ontologies/OSM-GTFS-zzz.owl"

# Source-specific extraction scripts, run in order. Each one writes the source KG listed
# under "sources". A source that is already available as RDF needs no script.
extraction:
  - "src/1_extraction_osm.py"
  - "src/1_extraction_kge.py"

sources:
  osm:
    kg: "output/osm_kg.ttl"
    # typed with the classes of the unifying ontology itself: no ontology or alignment needed
  kge:
    kg: "output/kge_kg.ttl"
    ontology: "ontologies/kge_ontology.owl"
    alignment: "config/alignment_kge.yaml"

outputs:
  # E-type graph: classes, hierarchy and properties of the sources plus their alignment
  teleontology: "output/teleontology.ttl"
  # entities of all sources and the owl:sameAs links between them
  entity_graph: "output/entity_graph.ttl"
  # flat schema of the entity graph: the e-types it uses, each with all its properties
  teleology: "output/teleology.ttl"
  report: "output/unification_report.csv"
