# Alignment of the KGE ontology to the unifying ontology (OSM-GTFS-zzz.owl).
# 2_mapping.py turns these rules into teleontology.ttl.
#
# The entities keep the types of the KGE graph: the teleology keeps the classes and
# properties of each source graph, and the teleontology only connects them to the
# unifying ontology. Two operations, for classes and properties alike:
#   equivalent  same concept as the unified term
#   child_of    narrower than the unified term (rdfs:subClassOf / rdfs:subPropertyOf)
# Classes and properties not listed here (e.g. etype:tourist, etype:has_EatAt) are not
# mapped: the unifying ontology covers space and time, and they stay as defined in the
# KGE ontology.

source: "kge"
source_ontology: "kge_ontology.owl"

namespaces:
  etype: "http://knowdive.disi.unitn.it/etype#"
  osm_ont: "http://www.semanticweb.org/lixiaoyue/ontologies/2023/2/untitled-ontology-26#"
  geo: "http://www.w3.org/2003/01/geo/wgs84_pos#"

classes:
  - {class: "etype:restaurant", operation: "child_of", target: "osm_ont:restaurant"}
  - {class: "etype:hotel", operation: "child_of", target: "osm_ont:hotel"}
  - {class: "etype:campsite", operation: "child_of", target: "osm_ont:camp_site"}
  - {class: "etype:museum", operation: "child_of", target: "osm_ont:museum"}
  - {class: "etype:amusement_park", operation: "child_of", target: "osm_ont:theme_park"}
  - {class: "etype:gas_station", operation: "child_of", target: "osm_ont:fuel"}
  - {class: "etype:bus_stop", operation: "child_of", target: "osm_ont:bus_stop"}
  - {class: "etype:bicycle_station", operation: "child_of", target: "osm_ont:bicycle_rental"}
  - {class: "etype:train_station", operation: "child_of", target: "osm_ont:railway_station"}
  # No OSM class matches these exactly: they go under the closest broader class.
  # Their entities are therefore not compared with OSM bars, pubs, cafes, ...
  - {class: "etype:bar_pub", operation: "child_of", target: "osm_ont:catering"}
  - {class: "etype:holiday_house", operation: "child_of", target: "osm_ont:accommodation"}
  - {class: "etype:natural_atraction", operation: "child_of", target: "osm_ont:tourism"}
  - {class: "etype:skiing_infrastructure", operation: "child_of", target: "osm_ont:tourism"}
  - {class: "etype:local_souvenir", operation: "child_of", target: "osm_ont:shopping"}

properties:
  - {property: "etype:has_name", operation: "equivalent", target: "osm_ont:name"}
  - {property: "etype:has_latitude", operation: "equivalent", target: "geo:lat"}
  - {property: "etype:has_longitude", operation: "equivalent", target: "geo:long"}
